[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "searchranklab"
version = "0.1.0"
description = "Research framework for query-adaptive sparse, dense, hybrid, and reranked search."
requires-python = ">=3.10"
dependencies = [
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
